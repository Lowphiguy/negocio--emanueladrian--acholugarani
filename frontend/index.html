<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Pokémon</title>
</head>
<body>
  <main>
    <h1>Buscador de Pokémon</h1>

    <div class="buscador">
      <input type="text" id="pokemon-input" placeholder="Escribe el nombre de un pokémon">
      <button id="buscar-btn">Buscar</button>
    </div>

    <p id="mensaje"></p>

    <section id="resultado" hidden>
      <h2 id="nombre"></h2>
      <img id="imagen" alt="">
      <p>Tipos: <span id="tipos"></span></p>
      <p>Peso: <span id="peso"></span></p>
      <p>Altura: <span id="altura"></span></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
